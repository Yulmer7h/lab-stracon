<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lab STRACON - Control de Ensayos</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React & React DOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <!-- Babel -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&family=JetBrains+Mono:wght@600;800&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Logo Lab STRACON
    const LogoStracon = () => (
      <div className="flex items-center gap-3">
        <div className="w-9 h-9 bg-[#E30613] rounded-lg flex items-center justify-center text-white font-black text-xl tracking-tighter shadow-sm">
          S
        </div>
        <div>
          <span className="font-black text-xl tracking-wider text-[#0A192F] block leading-none">STRACON</span>
          <span className="text-[10px] font-extrabold text-slate-400 tracking-wider uppercase block mt-0.5">LAB STRACON</span>
        </div>
      </div>
    );

    // Icono Tacho
    const IconTrash = () => (
      <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
      </svg>
    );

    function App() {
      const [moduloActivo, setModuloActivo] = useState('humedad'); // 'humedad' | 'compresion'
      
      // Estado para Humedad (ASTM D2216 / ASTM D4959)
      const [registrosHumedad, setRegistrosHumedad] = useState(() => {
        const saved = localStorage.getItem('stracon_lab_humedad');
        return saved ? JSON.parse(saved) : [];
      });

      // Estado para Compresión (ASTM C39 / C109)
      const [registrosCompresion, setRegistrosCompresion] = useState(() => {
        const saved = localStorage.getItem('stracon_lab_compresion');
        return saved ? JSON.parse(saved) : [];
      });

      const [usarTara, setUsarTara] = useState(true);

      // Formulario Humedad
      const [formHumedad, setFormHumedad] = useState({
        muestraId: '',
        recipienteId: '',
        m2: '',
        m1: '',
        m3: ''
      });

      // Formulario Compresión
      const [formCompresion, setFormCompresion] = useState({
        muestraId: '',
        tipoProbeta: 'cilindro_6x12',
        d1: '15.24',
        d2: '15.24',
        altura: '30.48',
        fcEspecificado: '21',
        unidadFcEsp: 'MPa',
        cargaMax: '', 
        unidadCarga: 'kN'
      });

      useEffect(() => {
        localStorage.setItem('stracon_lab_humedad', JSON.stringify(registrosHumedad));
      }, [registrosHumedad]);

      useEffect(() => {
        localStorage.setItem('stracon_lab_compresion', JSON.stringify(registrosCompresion));
      }, [registrosCompresion]);

      // Handlers
      const handleHumedadChange = (e) => setFormHumedad({ ...formHumedad, [e.target.name]: e.target.value });
      
      const handleCompresionChange = (e) => {
        const { name, value } = e.target;
        let updated = { ...formCompresion, [name]: value };

        if (name === 'tipoProbeta') {
          if (value === 'cilindro_6x12') {
            updated.d1 = '15.24';
            updated.d2 = '15.24';
            updated.altura = '30.48';
          } else if (value === 'cilindro_4x8') {
            updated.d1 = '10.16';
            updated.d2 = '10.16';
            updated.altura = '20.32';
          } else if (value === 'cubo_2in') {
            updated.d1 = '5.00';
            updated.d2 = '5.00';
            updated.altura = '5.00';
          }
        }
        setFormCompresion(updated);
      };

      // --- CÁLCULOS HUMEDAD ---
      const masaTara = usarTara ? parseFloat(formHumedad.m2) || 0 : 0;
      const masaHumedaConTara = parseFloat(formHumedad.m1) || 0;
      const masaSecaConTara = parseFloat(formHumedad.m3) || 0;
      const masaAgua = masaHumedaConTara > masaSecaConTara ? masaHumedaConTara - masaSecaConTara : 0;
      const masaSueloSeco = masaSecaConTara - masaTara;
      const porcentajeHumedad = masaSueloSeco > 0 ? ((masaAgua / masaSueloSeco) * 100).toFixed(2) : '0.00';

      // --- CÁLCULOS COMPRESIÓN (C39 / C109) ---
      const valD1 = parseFloat(formCompresion.d1) || 0;
      const valD2 = parseFloat(formCompresion.d2) || 0;
      const diamPromedio = (valD1 + valD2) / 2;

      const alt = parseFloat(formCompresion.altura) || 0;
      const carga = parseFloat(formCompresion.cargaMax) || 0;
      const valFcEsp = parseFloat(formCompresion.fcEspecificado) || 0;

      // Conversión de Carga
      let cargaKN = 0;
      let cargaKgf = 0;

      if (formCompresion.unidadCarga === 'kN') {
        cargaKN = carga;
        cargaKgf = carga * 101.9716;
      } else {
        cargaKgf = carga;
        cargaKN = carga / 101.9716;
      }

      const fcEspMPa = formCompresion.unidadFcEsp === 'kg/cm2' ? valFcEsp * 0.0980665 : valFcEsp;

      let area = 0;
      if (formCompresion.tipoProbeta.includes('cubo')) {
        area = valD1 * valD2;
      } else {
        area = Math.PI * Math.pow(diamPromedio / 2, 2);
      }

      let fcObtenidoKg = area > 0 ? (cargaKgf / area) : 0;

      let factorLD = 1.00;
      if (!formCompresion.tipoProbeta.includes('cubo') && diamPromedio > 0 && alt > 0) {
        const relacionLD = alt / diamPromedio;
        if (relacionLD < 1.75) {
          if (relacionLD >= 1.50) factorLD = 0.96;
          else if (relacionLD >= 1.25) factorLD = 0.93;
          else if (relacionLD >= 1.00) factorLD = 0.87;
        }
      }

      const fcCorregidoKg = fcObtenidoKg * factorLD;
      const fcMPa = fcCorregidoKg * 0.0980665;
      const porcentajeCumplimiento = fcEspMPa > 0 ? ((fcMPa / fcEspMPa) * 100).toFixed(1) : '0.0';

      const agregarHumedad = (e) => {
        e.preventDefault();
        if (!formHumedad.muestraId || masaHumedaConTara <= 0 || masaSecaConTara <= 0) return;

        const nuevo = {
          id: Date.now(),
          muestraId: formHumedad.muestraId,
          recipienteId: formHumedad.recipienteId || '-',
          usarTara,
          masaTara: masaTara.toFixed(2),
          masaHumedaConTara: masaHumedaConTara.toFixed(2),
          masaSecaConTara: masaSecaConTara.toFixed(2),
          masaAgua: masaAgua.toFixed(2),
          masaSueloSeco: masaSueloSeco.toFixed(2),
          humedad: porcentajeHumedad,
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setRegistrosHumedad([nuevo, ...registrosHumedad]);
        setFormHumedad({ muestraId: '', recipienteId: '', m2: '', m1: '', m3: '' });
      };

      const agregarCompresion = (e) => {
        e.preventDefault();
        if (!formCompresion.muestraId || carga <= 0 || area <= 0) return;

        const nuevo = {
          id: Date.now(),
          muestraId: formCompresion.muestraId,
          tipoProbeta: formCompresion.tipoProbeta,
          diamPromedio: diamPromedio.toFixed(2),
          area: area.toFixed(2),
          cargaKN: cargaKN.toFixed(1),
          cargaKgf: cargaKgf.toFixed(0),
          fcEspMPa: fcEspMPa.toFixed(1),
          fcObtenidoKg: fcCorregidoKg.toFixed(1),
          fcMPa: fcMPa.toFixed(2),
          cumplimiento: porcentajeCumplimiento,
          hora: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        };

        setRegistrosCompresion([nuevo, ...registrosCompresion]);
        setFormCompresion({ ...formCompresion, muestraId: '', cargaMax: '' });
      };

      return (
        <div className="max-w-6xl mx-auto p-4 md:p-6">
          
          {/* Header STRACON */}
          <header className="bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-wrap justify-between items-center gap-4 mb-6">
            <LogoStracon />
            
            <div className="flex items-center gap-2 bg-slate-100 p-1 rounded-lg border border-slate-200">
              <button
                onClick={() => setModuloActivo('humedad')}
                className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${
                  moduloActivo === 'humedad'
                    ? 'bg-[#0A192F] text-white shadow-sm'
                    : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                Humedad (ASTM D2216 / D4959)
              </button>
              <button
                onClick={() => setModuloActivo('compresion')}
                className={`px-3 py-1.5 rounded-md text-xs font-bold transition-all ${
                  moduloActivo === 'compresion'
                    ? 'bg-[#0A192F] text-white shadow-sm'
                    : 'text-slate-600 hover:text-slate-900'
                }`}
              >
                Compresión (ASTM C39 / C109)
              </button>
            </div>
          </header>

          {/* ===================== MÓDULO 1: HUMEDAD ===================== */}
          {moduloActivo === 'humedad' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

              {/* Formulario Humedad */}
              <div className="lg:col-span-5 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                  <div>
                    <h2 className="font-bold text-[#0A192F]">Ingreso de Humedad</h2>
                    <span className="text-[10px] text-slate-400 font-bold block">ASTM D2216 / ASTM D4959</span>
                  </div>
                  <button
                    type="button"
                    onClick={() => setUsarTara(!usarTara)}
                    className={`text-xs px-2.5 py-1 rounded font-bold transition-colors ${
                      usarTara 
                        ? 'bg-slate-100 text-[#0A192F] border border-slate-300' 
                        : 'bg-emerald-50 text-emerald-700 border border-emerald-200'
                    }`}
                  >
                    {usarTara ? 'CON TARA' : 'SIN TARA (DIRECTO)'}
                  </button>
                </div>

                <form onSubmit={agregarHumedad} className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-600">ID Muestra</label>
                    <input
                      type="text"
                      name="muestraId"
                      value={formHumedad.muestraId}
                      onChange={handleHumedadChange}
                      placeholder="Ej. M-01"
                      className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm focus:border-[#0A192F] outline-none mt-1 font-medium"
                      required
                    />
                  </div>

                  {usarTara && (
                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="text-xs font-bold text-slate-600">Cod. Recipiente</label>
                        <input
                          type="text"
                          name="recipienteId"
                          value={formHumedad.recipienteId}
                          onChange={handleHumedadChange}
                          placeholder="Ej. T-10"
                          className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm focus:border-[#0A192F] outline-none mt-1 font-medium"
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-600">Masa Tara (g)</label>
                        <input
                          type="number"
                          step="0.01"
                          name="m2"
                          value={formHumedad.m2}
                          onChange={handleHumedadChange}
                          placeholder="0.00"
                          className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono focus:border-[#0A192F] outline-none mt-1"
                          required={usarTara}
                        />
                      </div>
                    </div>
                  )}

                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-xs font-bold text-slate-600">
                        {usarTara ? 'Masa Húmeda + Tara (g)' : 'Masa Suelo Húmedo (g)'}
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        name="m1"
                        value={formHumedad.m1}
                        onChange={handleHumedadChange}
                        placeholder="0.00"
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono focus:border-[#0A192F] outline-none mt-1"
                        required
                      />
                    </div>
                    <div>
                      <label className="text-xs font-bold text-slate-600">
                        {usarTara ? 'Masa Seca + Tara (g)' : 'Masa Suelo Seco (g)'}
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        name="m3"
                        value={formHumedad.m3}
                        onChange={handleHumedadChange}
                        placeholder="0.00"
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono focus:border-[#0A192F] outline-none mt-1"
                        required
                      />
                    </div>
                  </div>

                  <div className="bg-slate-50 p-3.5 rounded border border-slate-200 flex justify-between items-center my-2">
                    <div className="text-xs text-slate-600 space-y-0.5">
                      <div>Agua: <strong className="text-slate-800 font-mono">{masaAgua.toFixed(2)} g</strong></div>
                      <div>Suelo Seco: <strong className="text-slate-800 font-mono">{masaSueloSeco > 0 ? masaSueloSeco.toFixed(2) : '0.00'} g</strong></div>
                    </div>
                    <div className="text-right">
                      <span className="text-[10px] font-extrabold text-slate-400 uppercase tracking-wider block">Humedad Natural</span>
                      <span className="text-2xl font-black text-[#E30613] font-mono">{porcentajeHumedad}%</span>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#E30613] hover:bg-red-700 text-white font-extrabold py-2.5 rounded transition-all shadow-sm text-sm"
                  >
                    + Registrar Humedad
                  </button>
                </form>
              </div>

              {/* Tabla Humedad */}
              <div className="lg:col-span-7 bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                  <h2 className="font-bold text-[#0A192F]">
                    Planilla de Humedades Guardadas
                  </h2>
                  <span className="text-xs font-extrabold text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded border border-slate-200">
                    Total: {registrosHumedad.length}
                  </span>
                </div>

                <div className="overflow-x-auto flex-1">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                        <th className="p-2.5">ID Muestra</th>
                        <th className="p-2.5">Modo</th>
                        <th className="p-2.5 text-right">S. Seco (g)</th>
                        <th className="p-2.5 text-right">Agua (g)</th>
                        <th className="p-2.5 text-right">Humedad %</th>
                        <th className="p-2.5 text-center">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {registrosHumedad.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="text-center py-8 text-slate-400 text-xs">
                            Sin registros en la planilla.
                          </td>
                        </tr>
                      ) : (
                        registrosHumedad.map((item) => (
                          <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                            <td className="p-2.5 font-bold text-slate-800">
                              {item.muestraId}
                              <span className="block text-[10px] text-slate-400 font-normal">{item.hora} {item.recipienteId !== '-' && `| Tara: ${item.recipienteId}`}</span>
                            </td>
                            <td className="p-2.5">
                              <span className={`text-[10px] px-2 py-0.5 rounded font-bold ${item.usarTara ? 'bg-slate-100 text-slate-700' : 'bg-emerald-100 text-emerald-800'}`}>
                                {item.usarTara ? 'Con Tara' : 'Directo'}
                              </span>
                            </td>
                            <td className="p-2.5 text-right font-mono text-slate-700">{item.masaSueloSeco}</td>
                            <td className="p-2.5 text-right font-mono text-slate-700">{item.masaAgua}</td>
                            <td className="p-2.5 text-right font-mono font-black text-[#E30613] text-base">{item.humedad}%</td>
                            <td className="p-2.5 text-center">
                              <button
                                onClick={() => setRegistrosHumedad(registrosHumedad.filter(r => r.id !== item.id))}
                                className="text-slate-400 hover:text-red-600 transition-colors"
                              >
                                <IconTrash />
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          )}

          {/* ===================== MÓDULO 2: COMPRESIÓN ===================== */}
          {moduloActivo === 'compresion' && (
            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">

              {/* Formulario Compresión */}
              <div className="lg:col-span-5 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <div className="flex justify-between items-center mb-4 pb-2 border-b border-slate-100">
                  <h2 className="font-bold text-[#0A192F]">Rotura a Compresión</h2>
                  <span className="text-[10px] bg-slate-100 text-slate-600 font-bold px-2 py-1 rounded">
                    ASTM C39 / C109
                  </span>
                </div>

                <form onSubmit={agregarCompresion} className="space-y-3.5">
                  <div>
                    <label className="text-xs font-bold text-slate-600">ID Muestra</label>
                    <input
                      type="text"
                      name="muestraId"
                      value={formCompresion.muestraId}
                      onChange={handleCompresionChange}
                      placeholder="Ej. C-101"
                      className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm focus:border-[#0A192F] outline-none mt-1 font-medium"
                      required
                    />
                  </div>

                  <div>
                    <label className="text-xs font-bold text-slate-600">Tipo de Probeta</label>
                    <select
                      name="tipoProbeta"
                      value={formCompresion.tipoProbeta}
                      onChange={handleCompresionChange}
                      className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm focus:border-[#0A192F] outline-none mt-1 font-semibold"
                    >
                      <option value="cilindro_6x12">Cilindro Concreto 6" x 12" (15x30 cm)</option>
                      <option value="cilindro_4x8">Cilindro Concreto 4" x 8" (10x20 cm)</option>
                      <option value="cubo_2in">Cubo Mortero 2" x 2" (5 cm) [C109]</option>
                      <option value="personalizado">Personalizado (Ingresar Medidas)</option>
                    </select>
                  </div>

                  {/* Dos Lecturas de Diámetro / Lado + f'c Especificado */}
                  <div className="grid grid-cols-3 gap-2.5">
                    <div className="flex flex-col justify-end">
                      <label className="text-[11px] font-bold text-slate-600 mb-1 block truncate">
                        {formCompresion.tipoProbeta.includes('cubo') ? 'Lado 1 (cm)' : 'Diámetro 1 (cm)'}
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        name="d1"
                        value={formCompresion.d1}
                        onChange={handleCompresionChange}
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono focus:border-[#0A192F] outline-none h-9"
                        required
                      />
                    </div>
                    <div className="flex flex-col justify-end">
                      <label className="text-[11px] font-bold text-slate-600 mb-1 block truncate">
                        {formCompresion.tipoProbeta.includes('cubo') ? 'Lado 2 (cm)' : 'Diámetro 2 (cm)'}
                      </label>
                      <input
                        type="number"
                        step="0.01"
                        name="d2"
                        value={formCompresion.d2}
                        onChange={handleCompresionChange}
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono focus:border-[#0A192F] outline-none h-9"
                        required
                      />
                    </div>
                    <div className="flex flex-col justify-end">
                      <div className="flex justify-between items-center mb-1">
                        <label className="text-[11px] font-bold text-slate-600">f'c Esp.</label>
                        <select
                          name="unidadFcEsp"
                          value={formCompresion.unidadFcEsp}
                          onChange={handleCompresionChange}
                          className="text-[10px] font-bold text-slate-600 bg-transparent outline-none cursor-pointer"
                        >
                          <option value="MPa">MPa</option>
                          <option value="kg/cm2">kg/cm²</option>
                        </select>
                      </div>
                      <input
                        type="number"
                        step="0.1"
                        name="fcEspecificado"
                        value={formCompresion.fcEspecificado}
                        onChange={handleCompresionChange}
                        placeholder={formCompresion.unidadFcEsp === 'MPa' ? "21" : "210"}
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono focus:border-[#0A192F] outline-none h-9"
                        required
                      />
                    </div>
                  </div>

                  {/* Carga Máxima e Ingreso en */}
                  <div className="grid grid-cols-3 gap-2">
                    <div className="col-span-2 flex flex-col justify-end">
                      <label className="text-xs font-bold text-slate-600 mb-1 block">Carga máxima</label>
                      <input
                        type="number"
                        step="0.1"
                        name="cargaMax"
                        value={formCompresion.cargaMax}
                        onChange={handleCompresionChange}
                        placeholder="0.0"
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-mono font-bold text-[#0A192F] focus:border-[#0A192F] outline-none h-9"
                        required
                      />
                    </div>
                    <div className="flex flex-col justify-end">
                      <label className="text-xs font-bold text-slate-600 mb-1 block">Ingreso en</label>
                      <select
                        name="unidadCarga"
                        value={formCompresion.unidadCarga}
                        onChange={handleCompresionChange}
                        className="w-full bg-slate-50 border border-slate-300 rounded p-2 text-sm font-bold focus:border-[#0A192F] outline-none h-9"
                      >
                        <option value="kN">kN</option>
                        <option value="kgf">kgf</option>
                      </select>
                    </div>
                  </div>

                  {/* Resultados Rápidos de Compresión */}
                  <div className="bg-slate-50 p-3.5 rounded border border-slate-200 space-y-2">
                    <div className="flex justify-between items-center text-xs text-slate-600 border-b border-slate-200 pb-2 flex-wrap gap-y-1">
                      <span>
                        Prom: <strong className="font-mono text-slate-800">{diamPromedio.toFixed(2)} cm</strong>
                      </span>
                      <span>
                        Área: <strong className="font-mono text-slate-800">{area.toFixed(2)} cm²</strong>
                      </span>
                      <span>
                        Carga máx: <strong className="font-mono text-slate-900 font-bold">
                          {formCompresion.unidadCarga === 'kN' 
                            ? `${Math.round(cargaKgf).toLocaleString('es-PE')} kgf` 
                            : `${cargaKN.toFixed(1)} kN`}
                        </strong>
                      </span>
                    </div>

                    <div className="flex justify-between items-end pt-1">
                      <div>
                        <span className="text-[10px] font-bold text-slate-400 block uppercase">Resistencia Obtenida</span>
                        <span className="text-2xl font-black text-[#E30613] font-mono">{fcMPa.toFixed(2)} <span className="text-xs font-bold text-slate-600">MPa</span></span>
                        <span className="block text-[11px] font-bold font-mono text-slate-600">({fcCorregidoKg.toFixed(1)} kg/cm²)</span>
                      </div>
                      <div className="text-right">
                        <span className="text-[10px] font-bold text-slate-400 block uppercase">% f'c Esp.</span>
                        <span className={`text-lg font-black font-mono ${parseFloat(porcentajeCumplimiento) >= 100 ? 'text-emerald-600' : 'text-amber-600'}`}>
                          {porcentajeCumplimiento}%
                        </span>
                      </div>
                    </div>
                  </div>

                  <button
                    type="submit"
                    className="w-full bg-[#E30613] hover:bg-red-700 text-white font-extrabold py-2.5 rounded transition-all shadow-sm text-sm"
                  >
                    + Registrar Rotura
                  </button>
                </form>
              </div>

              {/* Tabla Compresión con Columna Unificada de Resistencia */}
              <div className="lg:col-span-7 bg-white p-5 rounded-xl border border-slate-200 shadow-sm overflow-hidden flex flex-col">
                <div className="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
                  <h2 className="font-bold text-[#0A192F]">
                    Planilla de Ensayos de Compresión
                  </h2>
                  <span className="text-xs font-extrabold text-slate-500 bg-slate-100 px-2.5 py-0.5 rounded border border-slate-200">
                    Total: {registrosCompresion.length}
                  </span>
                </div>

                <div className="overflow-x-auto flex-1">
                  <table className="w-full text-left text-sm">
                    <thead>
                      <tr className="border-b border-slate-200 text-slate-500 text-xs uppercase bg-slate-50">
                        <th className="p-2.5">ID Muestra</th>
                        <th className="p-2.5 text-right">Área (cm²)</th>
                        <th className="p-2.5 text-center">Carga (kN / kgf)</th>
                        <th className="p-2.5 text-center">f'c (MPa / kg/cm²)</th>
                        <th className="p-2.5 text-right">% Esp.</th>
                        <th className="p-2.5 text-center">Acción</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {registrosCompresion.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="text-center py-8 text-slate-400 text-xs">
                            Sin ensayos de compresión registrados.
                          </td>
                        </tr>
                      ) : (
                        registrosCompresion.map((item) => (
                          <tr key={item.id} className="hover:bg-slate-50 transition-colors">
                            <td className="p-2.5 font-bold text-slate-800">
                              {item.muestraId}
                              <span className="block text-[10px] text-slate-400 font-normal">{item.hora} | Ø {item.diamPromedio} cm</span>
                            </td>
                            <td className="p-2.5 text-right font-mono font-semibold text-slate-700">
                              {item.area}
                            </td>
                            <td className="p-2.5 text-center font-mono text-slate-700">
                              <span className="font-bold block text-slate-900">{item.cargaKN} kN</span>
                              <span className="text-[10px] text-slate-400">({parseInt(item.cargaKgf).toLocaleString('es-PE')} kgf)</span>
                            </td>
                            <td className="p-2.5 text-center font-mono">
                              <span className="font-black text-[#E30613] text-base block">{item.fcMPa} MPa</span>
                              <span className="text-[10px] text-slate-500 font-semibold">({item.fcObtenidoKg} kg/cm²)</span>
                            </td>
                            <td className="p-2.5 text-right font-mono font-bold">
                              <span className={`px-1.5 py-0.5 rounded text-xs ${parseFloat(item.cumplimiento) >= 100 ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}`}>
                                {item.cumplimiento}%
                              </span>
                            </td>
                            <td className="p-2.5 text-center">
                              <button
                                onClick={() => setRegistrosCompresion(registrosCompresion.filter(r => r.id !== item.id))}
                                className="text-slate-400 hover:text-red-600 transition-colors"
                              >
                                <IconTrash />
                              </button>
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>

            </div>
          )}

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
